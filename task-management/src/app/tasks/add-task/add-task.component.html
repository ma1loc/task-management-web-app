<div class="backdrop" (click)="onCancel()"></div>
<dialog open>
  <p class="b1"> Title: {{title()}}</p>
  <form (ngSubmit)="onSubmet()">
    <p>
      <label for="title">title</label>
      <input type="text" id="title" name="title" [(ngModel)]="title" />
    </p>

    <p>
      <label for="summary">summary</label>
      <textarea id="summary" rows="5" name="summary" [(ngModel)]="summary"></textarea>
    </p>

    <p>
      <label for="date">Date</label>
      <input type="date" id="date" name="date" [(ngModel)]="date" />
    </p>

    <p class="action">
      <button type="submit">Create</button>
      <button type="button" (click)="onCancel()">Cancel</button>
    </p>
  </form>
</dialog>
